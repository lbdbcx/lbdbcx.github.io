<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Long Live The Queen 40 周路线与清单查询">
  <title>王冠路线图 · Long Live The Queen</title>
  <script>
    try {
      if (localStorage.getItem("lltq-guide-theme") === "light") document.documentElement.dataset.theme = "light";
    } catch {}
  </script>
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f6f3; --surface: #fffdfb; --ink: #241d2a; --muted: #675e6c;
      --line: #e8e0e5; --plum: #412348; --deep: #251429; --accent: #a64e6e;
      --pink: #f5e6ec; --green: #245f4a; --green-bg: #e8f3eb;
      --rust: #962f4b; --rust-bg: #faeaf0;
      --gold: #694811; --gold-bg: #f8efd8;
      --primary: #412348; --primary-hover: #57345e; --primary-text: #fff;
      --focus: #ac668c; --control-line: #d9cbd7; --field: #fff;
      --accent-text: #744763; --row-heading: #624459;
      --wash: #f8edf4; --row-header: #f7f1f5; --row-target: #fcf0f5; --row-closed: #faf7f9;
      --bar-shadow: #28142912; --dialog-shadow: #28142945; --backdrop: #24152bcc;
      --font: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
      --serif: "Palatino Linotype", Georgia, "Songti SC", "SimSun", serif;
      --topbar-height: 72px; --sticky-gap: 12px;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper: #17111c; --surface: #231a29; --ink: #f7edf6; --muted: #c7b7c6;
      --line: #47354b; --plum: #f2d3ed; --deep: #413047; --accent: #e18ab4;
      --pink: #4b2d46; --green: #a8dfc0; --green-bg: #24392f;
      --rust: #ffb7ca; --rust-bg: #452337;
      --gold: #f6d690; --gold-bg: #473721;
      --primary: #ead0eb; --primary-hover: #f7e1f4; --primary-text: #2b1830;
      --focus: #eca3c9; --control-line: #896887; --field: #1b1420;
      --accent-text: #dfafd2; --row-heading: #dfc3da;
      --wash: #36273b; --row-header: #2c2033; --row-target: #3a2539; --row-closed: #201825;
      --bar-shadow: #0b070e65; --dialog-shadow: #08050bad; --backdrop: #100a16d6;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-width: 280px; background: var(--paper); color: var(--ink); font: 1rem/1.52 var(--font); }
    button, input, select { font: inherit; }
    button { cursor: pointer; color: inherit; }
    button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid var(--focus); outline-offset: 4px;
    }
    button:disabled { opacity: .55; cursor: default; }
    a { color: var(--plum); text-underline-offset: .2em; }
    [hidden] { display: none !important; }
    .shell { width: min(100% - 72px, 1312px); margin-inline: auto; }
    .topbar { position: sticky; top: 0; z-index: 5; background: var(--surface); box-shadow: inset 0 -1px var(--line); }
    .topbar .shell { height: var(--topbar-height); display: flex; align-items: center; gap: 1rem; }
    .topbar.has-target { box-shadow: inset 0 -1px var(--line), 0 4px 12px var(--bar-shadow); }
    .wordmark { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .seal { display: grid; place-items: center; background: var(--deep); color: #f9d6e6; width: 42px; height: 42px; flex: none; border-radius: 10px; font: 1.65rem/1 var(--serif); }
    .wordmark strong { display: block; font-size: 1.05rem; line-height: 1.3; letter-spacing: .06em; }
    .wordmark small { display: block; color: var(--muted); font-size: .76rem; letter-spacing: .06em; }
    .topbar-actions { display: flex; flex: none; gap: .5rem; align-items: center; margin-inline-start: auto; }
    .action-short { display: none; }
    .pinned-target { min-width: 0; border-inline-start: 1px solid var(--line); padding-inline-start: 1rem; }
    .pinned-target strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--plum); line-height: 1.25; }
    .pinned-target small { display: block; color: var(--muted); font-size: .79rem; margin-top: 2px; }
    .pinned-target .pinned-details-short { display: none; }
    .button { border: 1px solid transparent; border-radius: 9px; padding: .57rem .95rem; min-height: 41px; font-size: .92rem; font-weight: 700; white-space: nowrap; }
    .button.primary { background: var(--primary); color: var(--primary-text); }
    .button.primary:hover { background: var(--primary-hover); }
    .button.secondary { background: var(--surface); border-color: var(--control-line); color: var(--plum); }
    .button.secondary:hover { background: var(--wash); }
    .topbar-actions .theme-toggle { width: 41px; padding: 0; display: inline-grid; place-items: center; font-size: 1.23rem; line-height: 1; }
    .hero { position: relative; isolation: isolate; overflow: hidden; margin: 30px 0 24px; border-radius: 21px; padding: clamp(26px,4vw,45px); color: #fff4f9; background: linear-gradient(116deg,#26152f 0%,#3b2146 63%,#542b50 100%); }
    .hero::before, .hero::after { content: ""; position: absolute; z-index: -1; width: 310px; height: 310px; top: -83px; right: -47px; border: 1px solid #f6cee529; transform: rotate(33deg); border-radius: 64px; pointer-events: none; }
    .hero::after { width: 380px; height: 380px; right: -23px; top: -130px; border-color: #f6cee521; }
    .hero-inner { display: flex; align-items: flex-end; justify-content: space-between; gap: 2rem; }
    .eyebrow { margin: 0 0 .8rem; font-size: .85rem; letter-spacing: .10em; color: #f2b7d4; }
    h1, h2, h3, p { overflow-wrap: anywhere; }
    h1 { margin: 0; font: 700 clamp(2rem,5vw,3.65rem)/1.1 var(--serif); letter-spacing: -.025em; }
    .hero-subtitle { margin: .7rem 0 0; color: #edd7eb; font-size: .96rem; }
    .hero-facts { display: flex; gap: 0; margin: 0; flex-shrink: 0; }
    .hero-facts div { padding: 0 1.1rem; border-left: 1px solid #eab6d550; }
    .hero-facts div:last-child { padding-right: 0; }
    .hero-facts dt { color: #efd7e9; font-size: .82rem; }
    .hero-facts dd { margin: 3px 0 0; font-size: 1.34rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .campaign { background: var(--pink); border: 1px solid var(--line); margin-bottom: 1rem; border-radius: 13px; padding: 14px 17px; }
    .campaign p { margin: 0 0 .7rem; }
    .campaign-options { display: flex; flex-wrap: wrap; gap: .4rem; }
    .campaign-options button { background: var(--surface); border: 1px solid var(--control-line); padding: .35rem .6rem; border-radius: 7px; font-size: .88rem; }
    .campaign-options button[aria-pressed=true] { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }
    .layout { display: grid; grid-template-columns: minmax(0,1fr) minmax(260px,294px); grid-template-areas: "weeks rewards"; gap: 24px; align-items: start; }
    .week-panel { grid-area: weeks; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 15px; }
    .panel-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 20px 20px 16px; }
    h2 { margin: 0; font-size: 1.18rem; letter-spacing: -.016em; }
    .route-note { margin: .3rem 0 0; color: var(--muted); font-size: .87rem; }
    select { appearance: none; padding: .4rem 2.2rem .4rem .7rem; border-radius: 8px; border: 1px solid var(--control-line); background: var(--surface); color: var(--plum); font-size: .9rem; max-width: 100%; }
    .select-wrap { position: relative; align-self: center; }
    .select-wrap::after { content: ""; position: absolute; width: 7px; height: 7px; border-right: 2px solid var(--accent-text); border-bottom: 2px solid var(--accent-text); rotate: 45deg; right: .85rem; top: calc(50% - 5px); pointer-events: none; }
    .periods { display: flex; flex-wrap: wrap; gap: 5px; padding: 1px 20px 14px; }
    .tab { border: 0; border-radius: 7px; background: transparent; padding: .35rem .7rem; font-size: .9rem; color: var(--muted); min-height: 36px; }
    .tab:hover { background: var(--wash); color: var(--plum); }
    .tab[aria-pressed=true] { background: var(--pink); color: var(--plum); font-weight: 700; }
    .route-head { display: grid; grid-template-columns: 64px minmax(108px,.95fr) minmax(185px,1.55fr) minmax(166px,1.38fr); gap: 14px; align-items: center; border-block: 1px solid var(--line); background: var(--row-header); padding: 9px 20px; color: var(--row-heading); font-size: .83rem; font-weight: 700; }
    .week-row { display: grid; grid-template-columns: 64px minmax(108px,.95fr) minmax(185px,1.55fr) minmax(166px,1.38fr); gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--line); font-size: .9rem; }
    .week-row:last-child { border-bottom: 0; }
    .week-row.is-target { background: var(--row-target); }
    .week-row.is-closed { color: var(--muted); background: var(--row-closed); }
    .week-heading { margin: 0; font-size: 1.09rem; line-height: 1.3; font-variant-numeric: tabular-nums; }
    .mood { display: block; font-size: .74rem; margin-top: 4px; color: var(--muted); }
    .course { margin: 0 0 .4rem; }
    .course:last-child, .event-list li:last-child { margin-bottom: 0; }
    .course strong { font-weight: 650; }
    .outfit-note { margin: 0 0 .55rem; font-weight: 650; line-height: 1.35; }
    .outfit-note.is-change { padding: .45rem .55rem; border-inline-start: 3px solid var(--accent); border-radius: 5px; background: var(--pink); color: var(--plum); }
    .outfit-note strong { display: block; font-weight: 750; }
    .minor { display: block; color: var(--muted); font-size: .77rem; font-variant-numeric: tabular-nums; }
    .event-list, .checks, .reward-list { list-style: none; margin: 0; padding: 0; }
    .event-list li { margin: 0 0 .23rem; }
    .marker { font-size: .74rem; margin-right: 5px; color: var(--accent-text); font-weight: 700; }
    .check { margin-bottom: .55rem; }
    .check:last-child { margin-bottom: .15rem; }
    .check-title { font-weight: 650; }
    .state { display: inline-block; margin-left: 5px; border-radius: 5px; padding: 0 5px; font-size: .72rem; font-weight: 700; line-height: 1.55; }
    .state.good { background: var(--green-bg); color: var(--green); }
    .state.bad { background: var(--rust-bg); color: var(--rust); }
    .state.partial { background: var(--gold-bg); color: var(--gold); }
    details { margin-top: .35rem; }
    summary { color: var(--plum); cursor: pointer; font-weight: 600; font-size: .82rem; }
    details[open] .checks { padding-top: .35rem; }
    .row-rewards { display: block; margin-top: .35rem; color: var(--green); font-size: .77rem; }
    .span-row { grid-column: 2/-1; margin: 0; }
    .side {
      grid-area: rewards; position: sticky; top: calc(var(--topbar-height) + var(--sticky-gap));
      max-height: calc(100vh - var(--topbar-height) - var(--sticky-gap) * 2);
      max-height: calc(100dvh - var(--topbar-height) - var(--sticky-gap) * 2);
      display: flex; flex-direction: column; padding: 20px 16px;
    }
    .reward-groups { min-height: 0; overflow-y: auto; scrollbar-width: thin; }
    .reward-heading { display: flex; justify-content: space-between; align-items: center; gap: .7rem; }
    .rewards-toggle { display: none; }
    .side h2 { padding-inline: 3px; }
    .side .route-note { padding-inline: 3px; }
    .reward-section { margin-top: .95rem; border-top: 1px solid var(--line); padding-top: .75rem; }
    .reward-section h3 { margin: 0 3px .35rem; font-size: .88rem; color: var(--accent-text); }
    .reward { border: 0; background: transparent; text-align: left; width: 100%; padding: 6px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: .88rem; }
    .reward:hover { background: var(--wash); }
    .reward.active { color: var(--plum); background: var(--pink); font-weight: 700; }
    .reward small { color: var(--muted); font-size: .74rem; flex-shrink: 0; }
    .footer { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; font-size: .85rem; color: var(--muted); padding: 20px 0 35px; }
    .footer details { max-width: 720px; margin: 0; }
    .footer p { margin: .45rem 0 0; }
    dialog { padding: 0; width: min(640px,calc(100% - 30px)); max-height: min(760px,90dvh); background: var(--surface); color: var(--ink); border: 1px solid var(--control-line); border-radius: 17px; box-shadow: 0 18px 90px var(--dialog-shadow); overflow: hidden; }
    dialog::backdrop { background: var(--backdrop); }
    .dialog-inner { display: flex; flex-direction: column; max-height: min(758px,89dvh); }
    .dialog-top { padding: 18px 22px 12px; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .close { border: 1px solid var(--line); background: transparent; border-radius: 8px; width: 40px; height: 40px; font-size: 1.25rem; }
    .close:hover { background: var(--pink); }
    .modal-controls { padding: 0 22px 10px; }
    #search { width: 100%; padding: .62rem .72rem; border: 1px solid var(--control-line); border-radius: 8px; background: var(--field); color: var(--ink); }
    #search::placeholder { color: var(--muted); opacity: 1; }
    .categories { display: flex; flex-wrap: wrap; gap: .15rem; margin-top: .7rem; }
    .item-list { overflow: auto; overscroll-behavior: contain; padding: 4px 15px 15px; min-height: 100px; border-top: 1px solid var(--line); }
    .item-button { display: grid; grid-template-columns: 35px minmax(0,1fr) auto; text-align: left; width: 100%; gap: .65rem; align-items: center; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: .61rem .52rem; font-size: .95rem; }
    .item-button:last-child { border-bottom: 0; }
    .item-button:hover, .item-button[aria-current=true] { background: var(--wash); }
    .item-button strong { display: block; font-weight: 650; }
    .id-label { color: var(--accent-text); font-size: .75rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .item-category { color: var(--muted); font-size: .77rem; }
    .empty { padding: 1rem .65rem; color: var(--muted); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    @media (max-width: 1110px) {
      .shell { width: min(100% - 40px,1312px); }
      .layout { grid-template-columns: minmax(0,1fr) 230px; gap: 14px; }
      .route-head,.week-row { grid-template-columns: 43px minmax(100px,.90fr) minmax(135px,1.4fr) minmax(134px,1.3fr); gap: 10px; padding-inline: 13px; }
    }
    @media (max-width: 880px) {
      .layout { display: block; }
      .side { z-index: 2; margin-bottom: 14px; max-height: 42vh; max-height: 42dvh; }
      .rewards-toggle { display: inline-block; }
      .side:has(.rewards-toggle[aria-expanded=false]) .reward-groups { display: none; }
      .reward-groups { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; }
      .hero { margin-top: 20px; }
      .topbar.has-target .wordmark { display: none; }
      .pinned-target { border-inline-start: 0; padding-inline-start: 0; }
    }
    @media (max-width: 570px) {
      :root { --topbar-height: 64px; --sticky-gap: 6px; }
      .shell { width: calc(100% - 24px); }
      .topbar .shell { gap: .55rem; }
      .topbar-actions { gap: .3rem; }
      .topbar-actions .button { padding-inline: .55rem; font-size: .83rem; }
      .wordmark { gap: 8px; }
      .wordmark small { font-size: .67rem; }
      .seal { width: 34px; height: 34px; }
      .hero { margin-top: 13px; margin-bottom: 13px; border-radius: 14px; padding: 20px; }
      .hero-inner { flex-direction: column; align-items: flex-start; gap: 16px; }
      .hero-facts div { padding-inline: .8rem; }
      .hero-facts dd { font-size: 1.13rem; }
      .hero-facts div:first-child { border: 0; padding-left: 0; }
      .side { padding: 10px 13px; }
      .reward-groups { display: block; }
      .reward-section { margin-top: .6rem; padding-top: .5rem; }
      .reward-list { display: grid; grid-template-columns: 1fr 1fr; }
      .panel-top { padding: 13px; flex-wrap: wrap; }
      .periods { padding-inline: 13px; gap: 2px; }
      .route-head { display: none; }
      .week-row { grid-template-columns: minmax(80px,.65fr) minmax(160px,1.35fr); border-top: 1px solid var(--line); border-bottom: 0; }
      .when { grid-column: 1/-1; display: flex; align-items: baseline; gap: 8px; }
      .check-col { grid-column: 1/-1; border-top: 1px dashed var(--line); padding-top: 7px; }
      .span-row { grid-column: 1/-1; }
      .footer { flex-direction: column; }
    }
    @media (max-width: 395px) {
      .wordmark small { display: none; }
      .wordmark strong { font-size: .94rem; }
      .action-full, #pinned-details { display: none; }
      .action-short { display: inline; }
      .pinned-target .pinned-details-short { display: block; }
      .topbar-actions .theme-toggle { width: 36px; }
      .pinned-target small { line-height: 1.2; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <header id="topbar" class="topbar">
    <div class="shell">
      <div class="wordmark"><span class="seal" aria-hidden="true">♛</span><div><strong data-i18n="brand">王冠路线图</strong><small>Long Live The Queen</small></div></div>
      <div id="pinned-target" class="pinned-target" hidden>
        <strong id="pinned-title"></strong><small id="pinned-details"></small>
        <small id="pinned-details-short" class="pinned-details-short"></small>
      </div>
      <div class="topbar-actions">
        <button id="theme" class="button secondary theme-toggle" type="button" aria-label="切换浅色模式" title="切换浅色模式"><span id="theme-icon" aria-hidden="true">☀︎</span></button>
        <button id="language" class="button secondary" type="button" lang="en"><span id="language-full" class="action-full">English</span><span id="language-short" class="action-short">EN</span></button>
        <button id="choose" class="button primary" type="button" aria-haspopup="dialog" data-i18n-aria="choose">
          <span class="action-full" data-i18n="choose">选择目标</span><span class="action-short" data-i18n="chooseShort">选目标</span>
        </button>
      </div>
    </div>
  </header>
  <main class="shell">
    <section id="hero" class="hero" aria-labelledby="target-title">
      <div class="hero-inner">
        <div>
          <p id="target-type" class="eyebrow"></p>
          <h1 id="target-title"></h1>
          <p id="target-description" class="hero-subtitle"></p>
        </div>
        <dl class="hero-facts">
          <div><dt data-i18n="unlocksAt">目标解锁</dt><dd id="unlock-week"></dd></div>
          <div><dt data-i18n="routeEnd">路线终点</dt><dd id="route-end"></dd></div>
          <div><dt data-i18n="rewards">本路线解锁</dt><dd id="reward-total"></dd></div>
        </dl>
      </div>
    </section>
    <section id="campaign" class="campaign" aria-label="累计死亡路线" data-i18n-aria="deathCampaign" hidden>
      <p id="campaign-note"></p>
      <div class="campaign-options" id="campaign-options"></div>
    </section>
    <div class="layout">
      <aside class="panel side" aria-labelledby="rewards-heading">
        <div class="reward-heading"><h2 id="rewards-heading" data-i18n="rewards">本路线解锁</h2><button id="rewards-toggle" class="button secondary rewards-toggle" type="button" aria-expanded="false" aria-controls="rewards">展开</button></div>
        <p class="route-note" id="rewards-note"></p>
        <div id="rewards" class="reward-groups" tabindex="0" aria-labelledby="rewards-heading"></div>
      </aside>
      <section class="panel week-panel" aria-labelledby="route-heading">
        <div class="panel-top">
          <div><h2 id="route-heading" data-i18n="timeline">40 周路线</h2><p class="route-note" id="route-summary"></p></div>
          <label id="variants-wrap" class="select-wrap" hidden><span class="sr-only" data-i18n="routeVariants">该目标的路线</span><select id="variants"></select></label>
        </div>
        <div id="periods" class="periods" aria-label="按周数筛选" data-i18n-aria="weekFilter">
          <button class="tab" type="button" data-from="1" data-to="40" aria-pressed="true" data-i18n="allWeeks">全部 40 周</button>
          <button class="tab" type="button" data-from="1" data-to="10" aria-pressed="false">第 1–10 周</button>
          <button class="tab" type="button" data-from="11" data-to="20" aria-pressed="false">第 11–20 周</button>
          <button class="tab" type="button" data-from="21" data-to="30" aria-pressed="false">第 21–30 周</button>
          <button class="tab" type="button" data-from="31" data-to="40" aria-pressed="false">第 31–40 周</button>
        </div>
        <div class="route-head" aria-hidden="true"><span data-i18n="week">周次</span><span data-i18n="studies">课程与服装</span><span data-i18n="choices">剧情选项与周末</span><span data-i18n="checks">技能与判定</span></div>
        <div id="timeline" aria-label="逐周攻略" data-i18n-aria="weeklyGuide"></div>
      </section>
    </div>
    <footer class="footer">
      <details>
        <summary data-i18n="sources">数据来源与数值说明</summary>

","Lose the power to rule","伊洛蒂活了下来，却无法执政。部分路线里她仍能保留王冠。","Elodie survives but cannot govern Nova. In some routes, she keeps the crown."],"E09":["私生活与家族关系","Private lives and family ties","例如伊洛蒂与布琳、布里奥尼、埃夫拉尔或爱丽丝的关系、与夏洛特和解，或关于王室婚姻和子嗣的传闻。","The epilogue may cover Elodie's relationships, her reconciliation with Charlotte, or rumors about the royal family."],"E10":["对魔法的恐惧与疑虑","Fear of magic","例如远古森林的怪物扩散、莫尔瓦家族以魔法反抗、夏洛特无法唤醒水晶，或民众开始迫害疑似会魔法的人。","Monsters may spread from the Old Forest, Merva may fight back with magic, or people may turn against suspected magic users."],"E11":["处置露西尔","Deal with Lucille","士兵以叛国嫌疑为由袭击露西尔。根据决定，行动可能波及她的家人。","Soldiers target Lucille on suspicion of treason. Elodie's orders determine whether they also target her family."],"E12":["女王病倒","The queen falls ill","伊洛蒂在露西尔照料下从高烧中恢复，但可能无法生育。另一条路线中，她怀孕后身体不适，被班尼恩限制行动。","Elodie recovers from a fever under Lucille's care but may be unable to have children. In another route, Banion confines her after she falls ill during pregnancy."],"E13":["光明使重获认同","Acceptance of the Lumens","伊洛蒂战胜杉葭后，民众更愿意接纳光明使。部分路线里，朱莉安娜与塞尼涅也公开了彼此的关系。","After Elodie defeats Shanjia, people grow more accepting of Lumens. Julianna and Selene may make their relationship public."],"E14":["布里奥尼继承厄苏尔","Briony inherits Ursul","朱莉安娜指定侄女布里奥尼继承厄苏尔公爵领和她的光明使水晶。","Julianna names her niece Briony the heir to both the duchy of Ursul and her Lumen crystal."],"E15":["朱莉安娜遭到排斥","Julianna faces hostility","身为公开的光明使，朱莉安娜离开自己的领地时常受到怀疑和敌视。","People distrust Julianna when she travels outside her own lands because she is openly a Lumen."],"E16":["追随户上","Follow Togami","伊洛蒂放弃王位，随户上前往杉葭，成为他的手下。诺瓦由劳伦特继承，或因继承争议爆发内战。","Elodie gives up the throne and follows Togami to Shanjia. Laurent may inherit Nova, or the succession may lead to civil war."],"E17":["处理海怪","Deal with the Kraken","伊洛蒂与其他光明使持续加固海怪的封印，或在另一条路线里献祭夏洛特来驱逐它。","Elodie and the Lumens keep the Kraken sealed, or Elodie sacrifices Charlotte to banish it."],"E18":["民众对光明使心存芥蒂","Unease about the Lumens","民众接受女王拥有     function pressed(container, match) {
      container.querySelectorAll("button").forEach(button => {
        button.setAttribute("aria-pressed", String(match(button)));
      });
    }

    function renderPicker() {
      const query = search.value.trim().toLowerCase();
      const matches = data.items.filter(item =>
        (!category || item.id.startsWith(category)) &&
        [item.id, item.title, ...localization.items[item.id]].some(value => value.toLowerCase().includes(query))
      );
      itemsView.replaceChildren();
      for (const item of matches) {
        const button = node("button", undefined, "item-button");
        button.type = "button";
        if (item.id === target) button.setAttribute("aria-current", "true");
        const body = node("span");
        body.append(node("strong", itemTitle(item.id)), node("small", itemDescription(item.id), "minor"));
        button.append(node("span", item.id, "id-label"), body, node("span", t(item.id[0]), "item-category"));
        button.addEventListener("click", () => {
          showTarget(item.id);
          picker.close();
        });
        itemsView.append(button);
      }
      if (!matches.length) itemsView.append(node("p", t("empty"), "empty"));
      byId("search-status").textContent = t("matches", { count: matches.length });
    }

    function openPicker() {
      category = "";
      search.value = "";
      pressed(byId("categories"), button => button.dataset.type === "");
      renderPicker();
      picker.showModal();
      itemsView.scrollTop = 0;
      search.focus();
    }

    function showTarget(itemId) {
      if (!items.has(itemId)) return;
      target = itemId;
      const available = data.campaigns[target] || data.mapping[target];
      period = [1, 40];
      pressed(byId("periods"), button => button.dataset.to === "40" && button.dataset.from === "1");
      currentRoute = available[0];
      render();
      window.scrollTo({ top: 0 });
      updatePinnedTarget();
    }

    function activeRoute() {
      const route = routes.get(currentRoute);
      const campaign = data.campaigns[target];
      if (!campaign) return route;
      const count = campaign.indexOf(currentRoute) + 1;
      const cumulative = count === 5 ? "A03" : count === 11 ? "A04" : null;
      if (!cumulative) return route;
      const end = route.end;
      return {
        ...route,
        unlocks: { ...route.unlocks, [cumulative]: end },
        weeks: { ...route.weeks, [end]: { ...route.weeks[end], unlock: [...route.weeks[end].unlock, cumulative] } }
      };
    }

    function renderCampaign() {
      const ids = data.campaigns[target];
      byId("campaign").hidden = !ids;
      if (!ids) return;
      byId("campaign-note").textContent = t("campaignNote", { count: ids.length });
      const container = byId("campaign-options");
      container.replaceChildren();
      ids.forEach((routeId, index) => {
        const route = routes.get(routeId);
        const deathId = Object.keys(route.unlocks).find(itemId => itemId.startsWith("D"));
        const button = node("button", (index + 1) + " · " + itemTitle(deathId));
        button.type = "button";
        button.setAttribute("aria-pressed", String(routeId === currentRoute));
        button.addEventListener("click", () => {
          currentRoute = routeId;
          period = [1, 40];
          pressed(byId("periods"), entry => entry.dataset.from === "1" && entry.dataset.to === "40");
          render();
          container.children[index].focus();
        });
        container.append(button);
      });
    }

    function renderRewards(route) {
      const container = byId("rewards");
      container.replaceChildren();
      for (const type of types) {
        const entries = Object.entries(route.unlocks)
          .filter(([id]) => id.startsWith(type))
          .sort(([a, w1], [b, w2]) => w1 - w2 || a.localeCompare(b));
        if (!entries.length) continue;
        const group = node("section", undefined, "reward-section");
        group.append(node("h3", t(type) + " · " + entries.length));
        const list = node("ul", undefined, "reward-list");
        for (const [id, week] of entries) {
          const li = node("li");
          const button = node("button", undefined, id === target ? "reward active" : "reward");
          button.type = "button";
          button.append(node("span", itemTitle(id)), node("small", (data.campaigns[id] ? t("cumulative") + " · " : "") + weekLabel(week)));
          button.addEventListener("click", () => showTarget(id));
          li.append(button);
          list.append(li);
        }
        group.append(list);
        container.append(group);
      }
    }

    function makeCheck(check, week, events) {
      const li = node("li", undefined, "check");
      const prefix = "选项 · ";
      let name = check.name === "海战" ? t("war") : localizedTerm(check.name);
      if (check.name.startsWith(prefix)) {
        const choice = check.name.slice(prefix.length);
        name = t("choice") + " · " + choiceLabel(choice, week, events, events.findIndex(event => event.label === choice));
      }
      li.append(node("span", name, "check-title"));
      if (check.result) {
        const style = { pass: "good", fail: "bad", partial: "partial", gate: "good" }[check.result];
        li.append(node("span", t(check.result), "state " + style));
      }
      if (check.need) li.append(node("span", t("requirement") + " " + formatStats(check.need), "minor"));
      if (check.value) li.append(node("span", t("actual") + " " + formatStats(check.value), "minor"));
      return li;
    }

    function makeWeek(route, week) {
      const row = route.weeks[week];
      const isTarget = row && (row.unlock.includes(target) ||
        (data.campaigns[target] && row.unlock.some(id => id.startsWith("D"))));
      let className = "week-row";
      if (isTarget) className += " is-target";
      if (!row) className += " is-closed";
      const article = node("article", undefined, className);
      article.dataset.week = week;
      article.setAttribute("aria-label", weekLabel(week));
      const when = node("div", undefined, "when");
      when.append(node("h3", weekLabel(week), "week-heading"));
      article.append(when);
      if (!row) {
        const ending = week > route.end ? t("reachedEnd", { week: route.end }) : t("skippedWeek");
        article.append(node("p", ending, "span-row"));
        return article;
      }
      if (row.mood) when.append(node("span", localizedTerm(row.mood.split(" · ").at(-1)), "mood"));
      const courses = node("div");
      if (row.outfit) {
        const isChange = week > 1;
        const outfit = langIndex === 0 ? localization.outfits[row.outfit] : row.outfit;
        const reminder = node("p", undefined, isChange ? "outfit-note is-change" : "outfit-note");
        reminder.append(node("span", t(isChange ? "changeOutfit" : "outfit")), node("strong", outfit));
        courses.append(reminder);
      }
      row.classes.forEach(([name, value, gain], index) => {
        const line = node("p", undefined, "course");
        line.append(node("span", t(index ? "pm" : "am"), "marker"), node("strong", localizedTerm(name)), node("span", t("afterClass") + " " + value + " · +" + gain, "minor"));
        courses.append(line);
      });
      if (!row.classes.length && !row.outfit) courses.append(node("span", t("noClasses"), "minor"));
      article.append(courses);
      const eventCol = node("div");
      const events = node("ul", undefined, "event-list");
      row.events.forEach((event, index) => {
        const item = node("li");
        const label = choiceLabel(event.label, week, row.events, index);
        item.append(node("span", t(event.type === "weekend" ? "weekend" : "choice"), "marker"), document.createTextNode(label));
        events.append(item);
      });
      if (!row.events.length) eventCol.append(node("span", t("noEvents"), "minor"));
      else eventCol.append(events);
      if (row.note) {
        const note = week === 1 ? "startRun" : week === 40 ? "finishEpilogue" : "endRun";
        eventCol.append(node("span", t(note), "minor"));
      }
      if (row.unlock.length) {
        const unlocked = row.unlock.map(itemTitle).join(langIndex === 0 ? "、" : ", ");
        eventCol.append(node("span", t("unlocked") + " · " + unlocked, "row-rewards"));
      }
      article.append(eventCol);
      const checkCol = node("div", undefined, "check-col");
      const checks = row.checks;
      if (!checks.length) checkCol.append(node("span", t("noChecks"), "minor"));
      else {
        const list = node("ul", undefined, "checks");
        checks.slice(0, 2).forEach(check => list.append(makeCheck(check, week, row.events)));
        checkCol.append(list);
        if (checks.length > 2) {
          const extra = node("details");
          const more = node("ul", undefined, "checks");
          checks.slice(2).forEach(check => more.append(makeCheck(check, week, row.events)));
          extra.append(node("summary", t("moreChecks", { count: checks.length - 2 })), more);
          checkCol.append(extra);
        }
      }
      article.append(checkCol);
      return article;
    }

    function renderTimeline(route) {
      const children = document.createDocumentFragment();
      for (let week = period[0]; week <= period[1]; week++) children.append(makeWeek(route, week));
      timeline.replaceChildren(children);
    }

    function render() {
      const route = activeRoute();
      const campaign = data.campaigns[target];
      const week = campaign ? routes.get(campaign.at(-1)).end : route.unlocks[target];
      const unlockTime = campaign ? t("campaignAt", { run: campaign.length, week }) : t("atWeek", { week });
      const title = itemTitle(target);
      byId("target-type").textContent = t(target[0]) + " · " + target;
      byId("target-title").textContent = title;
      const hintPrefix = target === "A17" && langIndex === 0 ? t("patchHint") + " · " : "";
      byId("target-description").textContent = hintPrefix + itemDescription(target);
      byId("pinned-title").textContent = title;
      byId("pinned-title").title = title;
      byId("pinned-details").textContent = target + " · " + unlockTime;
      byId("pinned-details-short").textContent = target + " · " + (campaign ? t("campaignShort", { run: campaign.length, week }) : weekLabel(week));
      byId("unlock-week").textContent = campaign ? unlockTime : weekLabel(week);
      byId("route-end").textContent = weekLabel(route.end);
      byId("reward-total").textContent = t("itemCount", { count: Object.keys(route.unlocks).length });
      byId("rewards-note").textContent = t(campaign ? "cumulativeRewards" : "normalRewards");
      byId("route-summary").textContent = routeTitle(route.id) + " · " + stopLabel(route.stop) + " · " +
        t(route.end < 40 ? "earlyEnd" : "lateEnd");
      const available = data.mapping[target] || [];
      byId("variants-wrap").hidden = Boolean(campaign) || available.length < 2;
      variants.replaceChildren();
      if (!campaign) for (const routeId of available) {
        const option = node("option", routeTitle(routeId));
        option.value = routeId;
        option.selected = routeId === currentRoute;
        variants.append(option);
      }
      renderCampaign();
      renderRewards(route);
      renderTimeline(route);
      updatePinnedTarget();
    }

    function switchLanguage() {
      const boundary = topbar.getBoundingClientRect().bottom;
      const anchor = Array.from(timeline.children).find(row => row.getBoundingClientRect().bottom > boundary);
      const scrollAnchor = pinned.hidden || !anchor ? null : {
        week: anchor.dataset.week, top: anchor.getBoundingClientRect().top
      };
      langIndex = 1 - langIndex;
      try {
        localStorage.setItem("lltq-guide-language", langIndex === 0 ? "zh" : "en");
      } catch {}
      applyLanguage();
      render();
      if (scrollAnchor) {
        const sameWeek = timeline.querySelector('[data-week="' + scrollAnchor.week + '"]');
        if (sameWeek) window.scrollBy(0, sameWeek.getBoundingClientRect().top - scrollAnchor.top);
      }
      updatePinnedTarget();
    }

    byId("theme").addEventListener("click", toggleTheme);
    byId("language").addEventListener("click", switchLanguage);
    window.addEventListener("scroll", updatePinnedTarget, { passive: true });
    window.addEventListener("resize", updatePinnedTarget);
    byId("choose").addEventListener("click", openPicker);
    byId("close-picker").addEventListener("click", () => picker.close());
    picker.addEventListener("click", event => {
      if (event.target === picker) {
        const rect = picker.getBoundingClientRect();
        if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) picker.close();
      }
    });
    search.addEventListener("input", () => { renderPicker(); itemsView.scrollTop = 0; });
    search.addEventListener("keydown", event => {
      if (event.key === "ArrowDown" || event.key === "Enter") {
        const first = itemsView.querySelector("button");
        if (!first) return;
        event.preventDefault();
        if (event.key === "Enter") first.click();
        else first.focus();
      }
    });
    byId("categories").addEventListener("click", event => {
      const button = event.target.closest("button[data-type]");
      if (!button) return;
      category = button.dataset.type;
      pressed(byId("categories"), entry => entry === button);
      renderPicker();
      itemsView.scrollTop = 0;
    });
    byId("periods").addEventListener("click", event => {
      const button = event.target.closest("button[data-from]");
      if (!button) return;
      period = [Number(button.dataset.from), Number(button.dataset.to)];
      pressed(byId("periods"), entry => entry === button);
      renderTimeline(activeRoute());
    });
    byId("rewards-toggle").addEventListener("click", event => {
      const button = event.currentTarget;
      const expanded = button.getAttribute("aria-expanded") === "true";
      button.setAttribute("aria-expanded", String(!expanded));
      button.textContent = t(expanded ? "expand" : "collapse");
    });
    variants.addEventListener("change", () => { currentRoute = variants.value; render(); });
    applyLanguage();
    if (data.items.length) showTarget(target);
  </script>
</body>
</html>
